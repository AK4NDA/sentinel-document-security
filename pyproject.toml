[project]
name = "classified-document-access-control"
version = "0.1.0"
description = "Backend for the classified document access control system"
requires-python = ">=3.12,<3.14"
dependencies = [
    "aiosqlite>=0.22.1",
    "alembic>=1.20.1",
    "anyio>=4.16.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.32.0",
    "cryptography>=50.0.2",
    "fastapi[standard]>=0.162.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "pyotp>=2.10.0",
    "python-multipart>=0.0.33",
    "slowapi>=0.1.10",
    "sqlalchemy[asyncio]>=2.1.8",
    "structlog>=26.1.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
    "ASYNC210",
    "ASYNC230",
    "ASYNC240",
    "ASYNC250",
    "ASYNC251",
]

[tool.ruff.lint.per-file-ignores]
"app/api/**" = ["B008"]
